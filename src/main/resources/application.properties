spring.application.name=akira-educacion
spring.profiles.default=dev

# La API se publica bajo /api/v1 en los controladores; no se usa context-path.
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# Persistencia
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway: el esquema es propiedad de las migraciones
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=${DB_SCHEMA:akira}
spring.flyway.default-schema=${DB_SCHEMA:akira}
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=false

# Conexión PostgreSQL mediante variables de entorno
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/akira_educacion}
spring.datasource.username=${DB_USER:akira_app}
spring.datasource.password=${DB_PASSWORD:akira_app}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-init-sql=SET search_path TO ${DB_SCHEMA:akira}

# JWT
app.security.jwt.issuer=${JWT_ISSUER:akira-educacion}
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.ttl=${JWT_TTL:PT1H}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

