# Perfil de desarrollo local.
# La base debe ser local (localhost). Nunca apuntar a la base compartida externa.

spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:akira_dev}
spring.flyway.schemas=${DB_SCHEMA:akira_dev}
spring.flyway.default-schema=${DB_SCHEMA:akira_dev}

# El esquema se mantiene con Flyway; ddl-auto sigue en validate.
spring.jpa.hibernate.ddl-auto=validate

# Secreto SOLO para desarrollo. En producción debe venir de JWT_SECRET.
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}

# Datos de arranque para desarrollo. Cambiar o desactivar fuera de desarrollo local.
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.platform-admin-email=${APP_SEED_ADMIN_EMAIL:admin@akira.local}
app.seed.platform-admin-password=${APP_SEED_ADMIN_PASSWORD:Admin1234!}
app.seed.demo-enabled=${APP_SEED_DEMO:true}
app.seed.demo-institution-name=${APP_SEED_DEMO_INSTITUTION:Instituci\u00f3n Demo}
app.seed.demo-admin-email=${APP_SEED_DEMO_EMAIL:admin@demo.local}
app.seed.demo-admin-password=${APP_SEED_DEMO_PASSWORD:Demo1234!}
