# Perfil de pruebas automatizadas.
# Usa un esquema aislado (por defecto akira_test) dentro de la base local.
# El esquema se limpia y se vuelve a migrar al iniciar el contexto de pruebas.

spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:akira_test}
spring.flyway.schemas=${DB_SCHEMA:akira_test}
spring.flyway.default-schema=${DB_SCHEMA:akira_test}
spring.flyway.clean-disabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.security.jwt.secret=${JWT_SECRET:test-only-secret-change-me-0123456789abcdef}
app.security.jwt.ttl=PT1H

app.seed.enabled=false
app.seed.demo-enabled=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.org.hibernate.SQL=warn
logging.level.org.springframework.security=warn
