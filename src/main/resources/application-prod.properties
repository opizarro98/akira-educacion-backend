# Perfil de producción.
# Todos los valores sensibles deben llegar por variables de entorno.

spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.flyway.schemas=${DB_SCHEMA:public}
spring.flyway.default-schema=${DB_SCHEMA:public}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.seed.enabled=false
app.seed.demo-enabled=false

# OpenAPI deshabilitado por defecto en producción.
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}

logging.level.root=info
